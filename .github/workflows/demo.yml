name: Demo

on:
  push:
    branches: [main]

  workflow_dispatch:

env:
  SITSHELP_API_URL: https://sits-rag.ngrok.io

permissions:
  contents: read
  pages: write
  id-token: write

# Only one demo deploy at a time. Newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Build widget
        working-directory: widget
        run: |
          npm ci
          npm run build

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render example site
        run: |
          cp -r _extensions example/_extensions
          quarto render example -M "sitshelp-api-url:${SITSHELP_API_URL}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
