<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>sitsrag chat client</title>
  <desc>Circular chat avatar for the SITS RAG client. Cream face, dark navy screen inset, two LED indicators reading as eyes, and a small pixel grid showing one highlighted terracotta pixel — the same signature as the sitsmcp and sitsrag hex stickers.</desc>

  <circle cx="64" cy="64" r="60" fill="#f2e4c9" stroke="#1e3a5f" stroke-width="4"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#1e3a5f" stroke-width="0.8" opacity="0.35"/>

  <rect x="26" y="34" width="76" height="54" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.3" rx="4"/>

  <circle cx="46" cy="50" r="4.5" fill="#a6c179"/>
  <circle cx="82" cy="50" r="4.5" fill="#d97757"/>

  <g transform="translate(44 66)">
    <rect x="0"  y="0"  width="10" height="10" fill="#7a9d5c"/>
    <rect x="10" y="0"  width="10" height="10" fill="#a6c179"/>
    <rect x="20" y="0"  width="10" height="10" fill="#c4a86b"/>
    <rect x="30" y="0"  width="10" height="10" fill="#7a9d5c"/>

    <rect x="0"  y="10" width="10" height="10" fill="#a6c179"/>
    <rect x="10" y="10" width="10" height="10" fill="#d97757"/>
    <rect x="20" y="10" width="10" height="10" fill="#e6b34d"/>
    <rect x="30" y="10" width="10" height="10" fill="#8fb069"/>

    <g stroke="#1e3a5f" stroke-width="0.4" fill="none" opacity="0.5">
      <line x1="10" y1="0"  x2="10" y2="20"/>
      <line x1="20" y1="0"  x2="20" y2="20"/>
      <line x1="30" y1="0"  x2="30" y2="20"/>
      <line x1="0"  y1="10" x2="40" y2="10"/>
    </g>

    <rect x="10" y="10" width="10" height="10" fill="none" stroke="#f6ebc9" stroke-width="1.5"/>
  </g>
</svg>
